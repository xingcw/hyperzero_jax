 [project]
 name = "hyperzero-jax"
 version = "0.1.0"
 description = "HyperZero JAX project"
 readme = "README.md"
 requires-python = ">=3.10"

 dependencies = [
   "jax[tpu]>=0.4.31",
   "brax",
   "jaxlib>=0.4.31",
   "flax>=0.8.5",
   "optax>=0.2.2",
   "orbax-checkpoint>=0.5.15",
   "chex>=0.1.86",
   "numpy>=1.24.1",
   "hydra-core==1.2.0",
   "hydra-submitit-launcher==1.1.5",
  "pandas>=1.3.0",
  "matplotlib",
  "wandb",
  "termcolor",
  "GitPython",
  "torch",
  "pytest",
  "mujoco-warp",
 ]

 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
